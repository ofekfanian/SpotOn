name: SpotOn
options:
  bundleIdPrefix: com.spoton
  deploymentTarget:
    iOS: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  SpotOn:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpotOn
    resources:
      - SpotOn/Assets.xcassets
      - path: SpotOn/GoogleService-Info.plist
        optional: true
    entitlements:
      path: SpotOn/SpotOn.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.spoton.shared
    info:
      path: SpotOn/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Take a photo to learn what it is"
        NSPhotoLibraryUsageDescription: "Choose a photo to describe"
        NSMicrophoneUsageDescription: "Talk with the English tutor"
        NSSpeechRecognitionUsageDescription: "Transcribe your speech in the voice call"
        UIBackgroundModes:
          - fetch
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseDatabase
      - target: SpotOnWidget
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.spoton.SpotOn
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  SpotOnWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpotOnWidget
    entitlements:
      path: SpotOnWidget/SpotOnWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.spoton.shared
    info:
      path: SpotOnWidget/Info.plist
      properties:
        CFBundleDisplayName: SpotOn
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.spoton.SpotOn.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
